{% extends "blog/base.html" %}
{% block title %}{% if object %}Editar{% else %}Nova publicação{% endif %}{% endblock %}
{% block content %}
  <h1>{% if object %}Editar publicação{% else %}Nova publicação{% endif %}</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Salvar</button>
    <a href="{% url 'post_list' %}">Cancelar</a>
  </form>
{% endblock %}

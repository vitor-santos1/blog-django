{% extends "blog/base.html" %}
{% block title %}Excluir{% endblock %}
{% block content %}
  <h1>Excluir publicação</h1>
  <p>Tem certeza que deseja excluir "<strong>{{ post.title }}</strong>"? Esta ação não pode ser desfeita.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn danger">Sim, excluir</button>
    <a href="{{ post.get_absolute_url }}">Cancelar</a>
  </form>
{% endblock %}
